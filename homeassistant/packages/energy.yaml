
# Energy helpers that combine the main production and consumption sources.
# Entity IDs below are verified against the live entity registry. A unique_id
# is not an entity_id. Missing measurements must not become zero readings.

sensor:
  - platform: integration
    source: sensor.total_home_generation
    name: Total Home Generation Energy
    unique_id: total_home_generation_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.total_home_consumption
    name: Total Home Consumption Energy
    unique_id: total_home_consumption_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.home_grid_import
    name: Home Grid Import Energy
    unique_id: home_grid_import_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.home_grid_export
    name: Home Grid Export Energy
    unique_id: home_grid_export_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.total_home_supply
    name: Total Home Supply Energy
    unique_id: total_home_supply_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.balcony_pv_power
    name: Balcony PV Energy
    unique_id: balcony_pv_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.home_heat_pump_consumption
    name: Home Heat Pump Consumption Energy
    unique_id: home_heatpump_consumption_energy_kwh
    method: left
    unit_prefix: k
    round: 3
    max_sub_interval:
      minutes: 5

template:
  - sensor:
      - name: Total Home Generation
        unique_id: total_home_generation_w
        availability: >
          {{ is_number(states('sensor.growatt_pv_power'))
             and is_number(states('sensor.balcony_pv_power'))
             and is_number(states('sensor.4_pv_oben_leistung')) }}
        state: >
          {% set growatt = states('sensor.growatt_pv_power') | float(0) %}
          {% set balcony = states('sensor.balcony_pv_power') | float(0) %}
          {% set pv_oben = states('sensor.4_pv_oben_leistung') | float(0) %}
          {{ (growatt + balcony + pv_oben) | round(1) }}
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Total Home Supply
        unique_id: total_home_supply_w
        availability: >
          {{ is_number(states('sensor.total_home_generation'))
             and is_number(states('sensor.home_grid_import')) }}
        state: >
          {% set generation = states('sensor.total_home_generation') | float(0) %}
          {% set grid_import = states('sensor.home_grid_import') | float(0) %}
          {{ (generation + grid_import) | round(1) }}
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Total Home Consumption
        unique_id: total_home_consumption_w
        availability: "{{ is_number(states('sensor.growatt_house_consumption')) }}"
        state: "{{ states('sensor.growatt_house_consumption') | float(0) | round(1) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Home PV Surplus
        unique_id: home_pv_surplus_w
        availability: >
          {{ is_number(states('sensor.total_home_generation'))
             and is_number(states('sensor.total_home_consumption')) }}
        state: >
          {% set generation = states('sensor.total_home_generation') | float(0) %}
          {% set consumption = states('sensor.total_home_consumption') | float(0) %}
          {{ (generation - consumption) | round(1) }}
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Home Grid Import
        unique_id: home_grid_import_w
        availability: "{{ is_number(states('sensor.growatt_grid_import')) }}"
        state: "{{ states('sensor.growatt_grid_import') | float(0) | round(1) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Home Grid Export
        unique_id: home_grid_export_w
        availability: "{{ is_number(states('sensor.growatt_grid_export')) }}"
        state: "{{ states('sensor.growatt_grid_export') | float(0) | round(1) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Home Battery SoC
        unique_id: home_battery_soc_percent
        availability: "{{ is_number(states('sensor.growatt_battery_soc')) }}"
        state: "{{ states('sensor.growatt_battery_soc') | float(0) | round(0) }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: Home Battery Power
        unique_id: home_battery_power_w
        availability: "{{ is_number(states('sensor.growatt_battery_power')) }}"
        state: "{{ states('sensor.growatt_battery_power') | float(0) | round(1) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Home Heat Pump Consumption
        unique_id: home_heatpump_consumption_w
        availability: "{{ is_number(states('sensor.heat_pump_power')) }}"
        state: "{{ states('sensor.heat_pump_power') | float(0) | round(1) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
